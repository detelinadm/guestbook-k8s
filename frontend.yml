apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/detelinadm/ocp-guestbook/frontend:e5dcb2203d76aaa6e0255ead33caee7d5d868664
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080