apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/detelinadm/ocp-guestbook/frontend:bb287989cfdda07a229920872f8be25b3d108a9d
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080